document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element: warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags: manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames, from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below, so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document: a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts, file://, everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe): location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match: accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative, never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate: a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor'): an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent: the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs:
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here: they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin: blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec: re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page: from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;{{ selCampaigns }}\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><path d=\"M5 21V4.5c4-2 8 2 12 0v9c-4 2-8-2-12 0\"><\u002Fpath><\u002Fsvg>\n        <span style=\"{{ hideLabelCss }}\">Campaigns<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goProviders }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:#54625B;font:600 14px/1 'Satoshi',system-ui;padding:11px 12px;border-radius:12px;{{ selProviders }}\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><path d=\"M4 21V6.2L12 3v18M12 21h8V10.4L12 6.6\"><\u002Fpath><path d=\"M7.4 9.5h1.6M7.4 13.5h1.6M7.4 17.5h1.6M15 12.5h1.8M15 16.5h1.8\"><\u002Fpath><\u002Fsvg>\n        <span style=\"{{ hideLabelCss }}\">Providers<\u002Fspan>\n        <sc-if value=\"{{ pendingBadge }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"margin-left:auto;font:700 11px/1 'Space Mono',ui-monospace,monospace;background:#F7E7DD;color:#A34F2B;border-radius:999px;padding:4px 7px;{{ hideLabelCss }}\">{{ pendingBadge }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goLeads }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:#54625B;font:600 14px/1 'Satoshi',system-ui;padding:11px 12px;border-radius:12px;{{ selLeads }}\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><circle cx=\"9.2\" cy=\"8\" r=\"3.2\"><\u002Fcircle><path d=\"M3.2 20c0-3.3 2.7-5.6 6-5.6s6 2.3 6 5.6\"><\u002Fpath><path d=\"M16.2 5.6a3.2 3.2 0 0 1 0 6.3M18.4 19.6c0-2.4-.8-3.9-2.1-4.8\"><\u002Fpath><\u002Fsvg>\n        <span style=\"{{ hideLabelCss }}\">Leads<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goDeep }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:#54625B;font:600 14px/1 'Satoshi',system-ui;padding:11px 12px;border-radius:12px;{{ selDeep }}\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><path d=\"M14 3.2H7.4A2.2 2.2 0 0 0 5.2 5.4v13.2A2.2 2.2 0 0 0 7.4 20.8h9.2a2.2 2.2 0 0 0 2.2-2.2V8.2z\"><\u002Fpath><path d=\"M14 3.2v5h4.8M9 13h6M9 16.6h4\"><\u002Fpath><\u002Fsvg>\n        <span style=\"{{ hideLabelCss }}\">Deep reads<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goAudit }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:#54625B;font:600 14px/1 'Satoshi',system-ui;padding:11px 12px;border-radius:12px;{{ selAudit }}\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><circle cx=\"12\" cy=\"12\" r=\"8.6\"><\u002Fcircle><path d=\"M12 7.4V12l3.3 2\"><\u002Fpath><\u002Fsvg>\n        <span style=\"{{ hideLabelCss }}\">Audit<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n\n    <div style=\"margin-top:auto;border:1px solid #e7ebe6;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;background:#F6F4EE\">\n      <div style=\"width:34px;height:34px;border-radius:999px;background:linear-gradient(140deg,#2B3A33,#1E9E63);flex:0 0 auto\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:1px;overflow:hidden;{{ hideLabelCss }}\">\n        <span style=\"font:700 13px/1.2 'Satoshi',system-ui;color:#0A2018\">{{ adminName }}<\u002Fspan>\n        <span style=\"font:400 11.5px/1.2 'Inter',system-ui;color:#5F6B64\">Platform admin<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1 1 auto;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px clamp(18px,2.8vw,30px);background:rgba(250,248,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid #e7ebe6\">\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleSidebar }}\" aria-label=\"Toggle navigation\" style=\"border:1.5px solid #e7ebe6;background:#ffffff;border-radius:11px;width:36px;height:36px;display:grid;place-items:center;color:#2B3A33;flex:0 0 auto\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\">\n        <span style=\"font:800 17px/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018\">Good afternoon, {{ adminName }}<\u002Fspan>\n        <span style=\"font:400 12.5px/1.2 'Inter',system-ui;color:#5F6B64\">Staff mode · every action here is audited<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:8px;background:#ffffff;border:1px solid #e7ebe6;border-radius:12px;padding:8px 12px;width:250px;max-width:32vw\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6B64\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><circle cx=\"11\" cy=\"11\" r=\"6.6\"><\u002Fcircle><path d=\"M16 16l4 4\"><\u002Fpath><\u002Fsvg>\n          <input type=\"search\" placeholder=\"Search orgs, campaigns, keys\" value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" style=\"border:0;outline:0;background:transparent;width:100%;font-size:13.5px\">\n        <\u002Fdiv>\n        <div style=\"width:38px;height:38px;border-radius:999px;background:linear-gradient(140deg,#2B3A33,#1E9E63);flex:0 0 auto\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"width:100%;max-width:1180px;margin:0 auto;padding:clamp(18px,2.8vw,30px);display:flex;flex-direction:column;gap:20px\">\n\n      <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Situational awareness<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Console overview<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">The state of the platform right now: what's waiting on a human, and whether bidding is live.<\u002Fp>\n        <\u002Fdiv>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both;display:flex;gap:24px;align-items:center;flex-wrap:wrap\">\n          <div style=\"flex:1 1 340px;min-width:280px\">\n            <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Bidding control<\u002Fdiv>\n            <h3 style=\"font:700 17.5px/1.3 'Satoshi',system-ui;color:#0A2018;margin:8px 0 6px\">Global kill switch<\u002Fh3>\n            <p style=\"margin:0;font-size:13px;color:#54625B;max-width:52ch\">One flag, enforced in the API, not just hidden in the UI. Turning it off refuses every bid on every campaign within a minute, and partners see the notice on their desk.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:18px;flex:0 0 auto\">\n            <div style=\"text-align:right\">\n              <div style=\"font:700 15px/1.2 'Satoshi',system-ui;{{ killLabelCss }}\">{{ killLabel }}<\u002Fdiv>\n              <div style=\"font:400 11.5px/1.4 'Space Mono',ui-monospace,monospace;color:#5F6B64;margin-top:3px\">bidding_enabled = {{ killValue }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"button\" role=\"switch\" sc-camel-on-click=\"{{ askToggleBidding }}\" aria-label=\"Global bidding\" style=\"border:0;padding:0;width:74px;height:40px;border-radius:999px;background:#D9D2BF;position:relative;transition:background .18s ease;flex:0 0 auto;{{ killTrackCss }}\">\n              <span style=\"position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:999px;background:#ffffff;box-shadow:0 2px 6px rgba(10,32,24,.25);transition:transform .18s ease;{{ killKnobCss }}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:14px\">\n          <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:18px;padding:17px 18px;box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both;{{ t.delay }}\">\n              <div style=\"font:700 11px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#5F6B64\">{{ t.label }}<\u002Fdiv>\n              <div style=\"font:700 27px/1.1 'Space Mono',ui-monospace,monospace;margin:10px 0 4px;{{ t.numCss }}\">{{ t.value }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#54625B\">{{ t.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.62fr 1fr;gap:18px;align-items:start\">\n          <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both;animation-delay:.12s\">\n            <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Queue health<\u002Fdiv>\n            <h3 style=\"font:700 17.5px/1.3 'Satoshi',system-ui;color:#0A2018;margin:8px 0 16px\">CRM sync queue<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:15px\">\n              <sc-for list=\"{{ queues }}\" as=\"q\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:7px\">\n                    <span style=\"font-size:13.5px;font-weight:500;color:#2B3A33\">{{ q.label }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font:700 13px/1 'Space Mono',ui-monospace,monospace;{{ q.numCss }}\">{{ q.count }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;border-radius:999px;background:#E7E2D3;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:999px;background:#1E9E63;{{ q.barCss }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:16px 0 0;font-size:12.5px;color:#54625B\">Counts come from <span style=\"font-family:'Space Mono',ui-monospace,monospace\">SELECT COUNT<\u002Fspan>, not a paged read: nothing here is capped at 300 rows.<\u002Fp>\n          <\u002Fsection>\n\n          <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both;animation-delay:.18s\">\n            <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Last 24 hours<\u002Fdiv>\n            <h3 style=\"font:700 17.5px/1.3 'Satoshi',system-ui;color:#0A2018;margin:8px 0 14px\">Recent staff actions<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ recentActions }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid #e7ebe6\">\n                  <span style=\"font:400 11.5px/1.3 'Space Mono',ui-monospace,monospace;color:#5F6B64;flex:0 0 46px\">{{ a.time }}<\u002Fspan>\n                  <div style=\"min-width:0\">\n                    <div style=\"font:700 12.5px/1.3 'Space Mono',ui-monospace,monospace;color:#0A2018\">{{ a.action }}<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:#54625B;margin-top:2px\">{{ a.target }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ goAudit }}\" style=\"margin-top:14px;border:1.5px solid #e7ebe6;background:transparent;border-radius:12px;padding:9px 16px;font:650 13.5px/1 'Satoshi',system-ui;color:#2B3A33\" style-hover=\"background:#EDE8DB\">Open the audit trail<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isConfig }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Site information<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Site config<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">Business settings the marketing site and dashboards render. Saved here, live on the next page load: no deploy.<\u002Fp>\n        <\u002Fdiv>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both\">\n          <div style=\"display:flex;flex-direction:column;gap:0\">\n            <div style=\"display:grid;grid-template-columns:1.15fr 1.2fr 96px 110px;gap:14px;padding:0 0 10px;border-bottom:1px solid #e7ebe6;font:700 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#54625B\">\n              <span>Key<\u002Fspan><span>Value<\u002Fspan><span>Type<\u002Fspan><span style=\"text-align:right\">Published<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ configRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:1.15fr 1.2fr 96px 110px;gap:14px;padding:15px 0;border-bottom:1px solid #e7ebe6;align-items:start\">\n                <div style=\"min-width:0\">\n                  <div style=\"font:700 13px/1.3 'Space Mono',ui-monospace,monospace;color:#0A2018;word-break:break-word\">{{ row.key }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#54625B;margin-top:4px;text-wrap:pretty\">{{ row.description }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <sc-if value=\"{{ row.isBool }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ row.onToggleValue }}\" role=\"switch\" style=\"border:0;padding:0;width:38px;height:22px;border-radius:999px;background:#D9D2BF;position:relative;transition:background .18s ease;{{ row.trackCss }}\">\n                      <span style=\"position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:#ffffff;transition:transform .18s ease;{{ row.knobCss }}\"><\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ row.isText }}\">\n                    <input type=\"text\" value=\"{{ row.value }}\" sc-camel-on-change=\"{{ row.onEdit }}\" style=\"width:100%;border:1px solid #e7ebe6;border-radius:10px;padding:9px 11px;background:#F6F4EE;font:400 13px/1.4 'Space Mono',ui-monospace,monospace;color:#2B3A33\">\n                  <\u002Fsc-if>\n                  <div style=\"font-size:12px;color:#5F6B64;margin-top:6px;font-family:'Space Mono',ui-monospace,monospace\">updated {{ row.updated }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div><span style=\"font:700 11px/1 'Space Mono',ui-monospace,monospace;background:#F6F4EE;color:#54625B;border-radius:999px;padding:5px 9px;text-transform:uppercase;letter-spacing:.05em\">{{ row.type }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:8px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ row.onTogglePublish }}\" role=\"switch\" style=\"border:0;padding:0;width:38px;height:22px;border-radius:999px;background:#D9D2BF;position:relative;transition:background .18s ease;{{ row.pubTrackCss }}\">\n                    <span style=\"position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:#ffffff;transition:transform .18s ease;{{ row.pubKnobCss }}\"><\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ saveConfig }}\" style=\"border:0;background:#1E9E63;color:#ffffff;border-radius:12px;padding:11px 20px;font:650 14px/1 'Satoshi',system-ui\" style-hover=\"background:#178A5A\">{{ saveLabel }}<\u002Fbutton>\n            <p style=\"margin:0;font-size:12.5px;color:#54625B;max-width:58ch\">Unpublished keys stay staff-only: they never reach <span style=\"font-family:'Space Mono',ui-monospace,monospace\">/public/config<\u002Fspan>. Every write records the before and after value in the audit trail.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCampaigns }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Bidding control<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Campaigns<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">Moving a campaign to auction locks member joins and opens the partner bid window in the same act.<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ killOff }}\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;background:#F7E7DD;border:1px solid #C2643B;border-radius:16px;padding:14px 16px\">\n            <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#C2643B\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto;margin-top:1px\"><path d=\"M12 4.5 2.8 20h18.4z\"><\u002Fpath><path d=\"M12 10v4.4M12 17.2h.01\"><\u002Fpath><\u002Fsvg>\n            <div>\n              <div style=\"font:700 13.5px/1.3 'Satoshi',system-ui;color:#8C4622\">All bidding is paused platform-wide<\u002Fdiv>\n              <p style=\"margin:4px 0 0;font-size:12.5px;color:#A34F2B\">Per-campaign windows below are still recorded, but no bid can be placed until the global switch is back on.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both\">\n          <div style=\"display:grid;grid-template-columns:1.25fr 1.35fr 108px 118px 92px;gap:14px;padding:0 0 10px;border-bottom:1px solid #e7ebe6;font:700 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#54625B\">\n            <span>Campaign<\u002Fspan><span>Lifecycle<\u002Fspan><span style=\"text-align:right\">Households<\u002Fspan><span style=\"text-align:right\">Stage<\u002Fspan><span style=\"text-align:right\">Bidding<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ campaignRows }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"border-bottom:1px solid #e7ebe6\">\n              <div style=\"display:grid;grid-template-columns:1.25fr 1.35fr 108px 118px 92px;gap:14px;padding:15px 0;align-items:center\">\n                <div style=\"min-width:0\">\n                  <div style=\"font:700 14px/1.3 'Satoshi',system-ui;color:#0A2018\">{{ c.region }}<\u002Fdiv>\n                  <div style=\"font:400 11.5px/1.3 'Space Mono',ui-monospace,monospace;color:#5F6B64;margin-top:3px\">{{ c.id }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:0\">\n                  <sc-for list=\"{{ c.stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n                    <div style=\"display:flex;align-items:center;flex:1 1 auto;min-width:0\" title=\"{{ s.name }}\">\n                      <span style=\"width:9px;height:9px;border-radius:999px;background:#E7E2D3;flex:0 0 auto;{{ s.dotCss }}\"><\u002Fspan>\n                      <span style=\"height:2px;flex:1 1 auto;background:#E7E2D3;{{ s.lineCss }}\"><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"text-align:right;font:700 14px/1.2 'Space Mono',ui-monospace,monospace;color:#0A2018\">{{ c.households }}<span style=\"font-weight:400;font-size:11.5px;color:#5F6B64\"> / {{ c.target }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end\">\n                  <span style=\"display:inline-flex;align-items:center;gap:7px;border-radius:999px;font:700 12.5px/1 'Inter',system-ui;padding:6px 11px;{{ c.pillCss }}\">\n                    <span style=\"width:7px;height:7px;border-radius:999px;{{ c.dotCss }}\"><\u002Fspan>{{ c.kind }}\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:8px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ c.onToggleBid }}\" role=\"switch\" style=\"border:0;padding:0;width:38px;height:22px;border-radius:999px;background:#D9D2BF;position:relative;transition:background .18s ease;{{ c.trackCss }}\">\n                    <span style=\"position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:#ffffff;transition:transform .18s ease;{{ c.knobCss }}\"><\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;padding:0 0 15px\">\n                <sc-for list=\"{{ c.moves }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ m.onClick }}\" style=\"border:1.5px solid #e7ebe6;background:transparent;border-radius:11px;padding:7px 13px;font:650 12.5px/1 'Satoshi',system-ui;color:#2B3A33\" style-hover=\"background:#EDE8DB\">{{ m.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <span style=\"font-size:12.5px;color:#5F6B64;align-self:center;margin-left:4px\">{{ c.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button type=\"button\" sc-camel-on-click=\"{{ createCampaign }}\" style=\"margin-top:18px;border:0;background:#1E9E63;color:#ffffff;border-radius:12px;padding:11px 20px;font:650 14px/1 'Satoshi',system-ui\" style-hover=\"background:#178A5A\">Create a campaign<\u002Fbutton>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProviders }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">The human gate<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Providers<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">Approval is what unlocks a company's console. Nothing else in the system can set a company to approved.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ providerFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.onClick }}\" style=\"border:1.5px solid #e7ebe6;background:#ffffff;border-radius:999px;padding:8px 15px;font:650 13px/1 'Satoshi',system-ui;color:#54625B;{{ f.selCss }}\">{{ f.label }} <span style=\"font-family:'Space Mono',ui-monospace,monospace;font-size:12px\">{{ f.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both\">\n          <div style=\"display:grid;grid-template-columns:1.4fr 1.1fr 74px 108px 136px 28px;gap:14px;padding:0 0 10px;border-bottom:1px solid #e7ebe6;font:700 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#54625B\">\n            <span>Company<\u002Fspan><span>Domain<\u002Fspan><span style=\"text-align:right\">People<\u002Fspan><span style=\"text-align:right\">Signed up<\u002Fspan><span style=\"text-align:right\">Status<\u002Fspan><span><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ providerRows }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"border-bottom:1px solid #e7ebe6\">\n              <div sc-camel-on-click=\"{{ p.onExpand }}\" style=\"display:grid;grid-template-columns:1.4fr 1.1fr 74px 108px 136px 28px;gap:14px;padding:15px 0;align-items:center;cursor:pointer\" style-hover=\"background:#FAF8F3\">\n                <div style=\"font:700 14px/1.3 'Satoshi',system-ui;color:#0A2018;min-width:0\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.3 'Space Mono',ui-monospace,monospace;color:#54625B;overflow:hidden;text-overflow:ellipsis\">{{ p.domain }}<\u002Fdiv>\n                <div style=\"text-align:right;font:700 13.5px/1 'Space Mono',ui-monospace,monospace;color:#0A2018\">{{ p.people }}<\u002Fdiv>\n                <div style=\"text-align:right;font:400 12.5px/1 'Space Mono',ui-monospace,monospace;color:#54625B\">{{ p.signedUp }}<\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end\">\n                  <span style=\"display:inline-flex;align-items:center;gap:7px;border-radius:999px;font:700 12.5px/1 'Inter',system-ui;padding:6px 11px;{{ p.pillCss }}\">\n                    <span style=\"width:7px;height:7px;border-radius:999px;{{ p.dotCss }}\"><\u002Fspan>{{ p.statusLabel }}\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end;color:#5F6B64\">\n                  <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"transition:transform .2s ease;{{ p.chevCss }}\"><path d=\"M6 9.5l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ p.isOpen }}\">\n                <div style=\"display:grid;grid-template-columns:1.62fr 1fr;gap:20px;padding:4px 0 20px;animation:fadein .25s both\">\n                  <div style=\"background:#F6F4EE;border:1px solid #e7ebe6;border-radius:16px;padding:17px\">\n                    <div style=\"font:700 11px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Partner application<\u002Fdiv>\n                    <div style=\"display:grid;grid-template-columns:150px 1fr;gap:9px 14px;margin-top:13px\">\n                      <sc-for list=\"{{ p.appRows }}\" as=\"f\" hint-placeholder-count=\"6\">\n                        <span style=\"font-size:12.5px;color:#54625B\">{{ f.label }}<\u002Fspan>\n                        <span style=\"font:400 12.5px/1.45 'Space Mono',ui-monospace,monospace;color:#2B3A33;word-break:break-word\">{{ f.value }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:14px\">\n                    <div>\n                      <div style=\"font:700 11px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Signed up under this org<\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                        <sc-for list=\"{{ p.users }}\" as=\"u\" hint-placeholder-count=\"2\">\n                          <div style=\"display:flex;align-items:center;gap:10px\">\n                            <div style=\"width:28px;height:28px;border-radius:999px;background:linear-gradient(140deg,#2B3A33,#1E9E63);flex:0 0 auto\"><\u002Fdiv>\n                            <div style=\"min-width:0\">\n                              <div style=\"font:600 13px/1.3 'Inter',system-ui;color:#0A2018\">{{ u.name }}<\u002Fdiv>\n                              <div style=\"font:400 11.5px/1.3 'Space Mono',ui-monospace,monospace;color:#5F6B64;overflow:hidden;text-overflow:ellipsis\">{{ u.email }} · {{ u.role }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n                      <sc-if value=\"{{ p.canApprove }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ p.onApprove }}\" style=\"border:0;background:#1E9E63;color:#ffffff;border-radius:12px;padding:11px 18px;font:650 13.5px/1 'Satoshi',system-ui\" style-hover=\"background:#178A5A\">Approve this company<\u002Fbutton>\n                        <button type=\"button\" sc-camel-on-click=\"{{ p.onReject }}\" style=\"border:1.5px solid #C2643B;background:transparent;color:#A34F2B;border-radius:12px;padding:11px 18px;font:650 13.5px/1 'Satoshi',system-ui\" style-hover=\"background:#F7E7DD\">Reject<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ p.canSuspend }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ p.onSuspend }}\" style=\"border:1.5px solid #C2643B;background:transparent;color:#A34F2B;border-radius:12px;padding:11px 18px;font:650 13.5px/1 'Satoshi',system-ui\" style-hover=\"background:#F7E7DD\">Suspend access<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <p style=\"margin:0;font-size:12.5px;color:#54625B;text-wrap:pretty\">{{ p.note }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both;animation-delay:.1s\">\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Repair tool<\u002Fdiv>\n          <h3 style=\"font:700 17.5px/1.3 'Satoshi',system-ui;color:#0A2018;margin:8px 0 6px\">Merge duplicate organisations<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:13px;color:#54625B;max-width:66ch\">A signup race can create two orgs for one domain: one of them empty. Pick the survivor; memberships move across and the empty row is deleted.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#54625B\">Merge from\n              <sc-raw-select value=\"{{ mergeFrom }}\" sc-camel-on-change=\"{{ onMergeFrom }}\" style=\"border:1px solid #e7ebe6;background:#F6F4EE;border-radius:11px;padding:10px 12px;font:400 13px/1 'Space Mono',ui-monospace,monospace;min-width:230px\">\n                <sc-for list=\"{{ orgOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#54625B\">Into (survivor)\n              <sc-raw-select value=\"{{ mergeTo }}\" sc-camel-on-change=\"{{ onMergeTo }}\" style=\"border:1px solid #e7ebe6;background:#F6F4EE;border-radius:11px;padding:10px 12px;font:400 13px/1 'Space Mono',ui-monospace,monospace;min-width:230px\">\n                <sc-for list=\"{{ orgOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ askMerge }}\" style=\"border:1.5px solid #C2643B;background:transparent;color:#A34F2B;border-radius:12px;padding:11px 18px;font:650 13.5px/1 'Satoshi',system-ui\" style-hover=\"background:#F7E7DD\">Merge organisations<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLeads }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Visibility · read only<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Leads<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">A window on what came in. The CRM stays the place leads are worked: nothing here edits a lead.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ leadTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:1.5px solid #e7ebe6;background:#ffffff;border-radius:999px;padding:8px 15px;font:650 13px/1 'Satoshi',system-ui;color:#54625B;{{ t.selCss }}\">{{ t.label }} <span style=\"font-family:'Space Mono',ui-monospace,monospace;font-size:12px\">{{ t.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both\">\n          <div style=\"display:grid;grid-template-columns:118px 1.3fr 1fr 130px;gap:14px;padding:0 0 10px;border-bottom:1px solid #e7ebe6;font:700 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#54625B\">\n            <span>Received<\u002Fspan><span>Who<\u002Fspan><span>Where<\u002Fspan><span style=\"text-align:right\">Detail<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ leadRows }}\" as=\"l\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:118px 1.3fr 1fr 130px;gap:14px;padding:13px 0;border-bottom:1px solid #e7ebe6;align-items:center\">\n              <span style=\"font:400 12.5px/1 'Space Mono',ui-monospace,monospace;color:#54625B\">{{ l.when }}<\u002Fspan>\n              <span style=\"font-size:13.5px;color:#2B3A33;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ l.who }}<\u002Fspan>\n              <span style=\"font-size:13.5px;color:#54625B\">{{ l.where }}<\u002Fspan>\n              <span style=\"text-align:right;font:700 13px/1 'Space Mono',ui-monospace,monospace;color:#0A2018\">{{ l.detail }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap\">\n            <span style=\"font:400 12.5px/1 'Space Mono',ui-monospace,monospace;color:#54625B\">{{ leadRange }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ loadMoreLeads }}\" style=\"border:1.5px solid #e7ebe6;background:transparent;border-radius:12px;padding:9px 16px;font:650 13px/1 'Satoshi',system-ui;color:#2B3A33\" style-hover=\"background:#EDE8DB\">Load 25 more<\u002Fbutton>\n            <span style=\"font-size:12.5px;color:#5F6B64\">Paged deliberately: a single read tops out at 300 rows.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDeep }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Visibility<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Deep reads<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">Bills a household asked a human to read. Files open through an authed proxy: opening one writes an audit row.<\u002Fp>\n        <\u002Fdiv>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both\">\n          <div style=\"display:grid;grid-template-columns:112px 1.25fr 1fr 122px 190px;gap:14px;padding:0 0 10px;border-bottom:1px solid #e7ebe6;font:700 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#54625B\">\n            <span>Requested<\u002Fspan><span>Household<\u002Fspan><span>File<\u002Fspan><span style=\"text-align:right\">Status<\u002Fspan><span style=\"text-align:right\">Action<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ deepRows }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:112px 1.25fr 1fr 122px 190px;gap:14px;padding:14px 0;border-bottom:1px solid #e7ebe6;align-items:center\">\n              <span style=\"font:400 12.5px/1 'Space Mono',ui-monospace,monospace;color:#54625B\">{{ d.when }}<\u002Fspan>\n              <div style=\"min-width:0\">\n                <div style=\"font:600 13.5px/1.3 'Inter',system-ui;color:#0A2018\">{{ d.who }}<\u002Fdiv>\n                <div style=\"font:400 11.5px/1.3 'Space Mono',ui-monospace,monospace;color:#5F6B64\">{{ d.email }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:400 12.5px/1.3 'Space Mono',ui-monospace,monospace;color:#54625B;overflow:hidden;text-overflow:ellipsis\">{{ d.file }}<\u002Fspan>\n              <div style=\"display:flex;justify-content:flex-end\">\n                <span style=\"display:inline-flex;align-items:center;gap:7px;border-radius:999px;font:700 12.5px/1 'Inter',system-ui;padding:6px 11px;{{ d.pillCss }}\">\n                  <span style=\"width:7px;height:7px;border-radius:999px;{{ d.dotCss }}\"><\u002Fspan>{{ d.status }}\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:flex-end;gap:8px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.onOpen }}\" style=\"border:1.5px solid #e7ebe6;background:transparent;border-radius:11px;padding:8px 13px;font:650 12.5px/1 'Satoshi',system-ui;color:#2B3A33\" style-hover=\"background:#EDE8DB\">Open bill<\u002Fbutton>\n                <sc-if value=\"{{ d.canComplete }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ d.onComplete }}\" style=\"border:0;background:#1E9E63;color:#ffffff;border-radius:11px;padding:8px 13px;font:650 12.5px/1 'Satoshi',system-ui\" style-hover=\"background:#178A5A\">{{ d.completeLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ deepEmpty }}\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 20px;text-align:center\">\n              <svg width=\"72\" height=\"56\" sc-camel-view-box=\"0 0 72 56\" fill=\"none\" stroke=\"#1E9E63\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 8h28l14 13v27a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z\"><\u002Fpath><path d=\"M42 8v13h14\" stroke=\"#C2643B\"><\u002Fpath><path d=\"M24 32h20M24 40h13\" stroke=\"#C2643B\"><\u002Fpath><\u002Fsvg>\n              <h3 style=\"font:700 17.5px/1.3 'Satoshi',system-ui;color:#0A2018;margin:0\">The queue is clear<\u002Fh3>\n              <p style=\"margin:0;font-size:13px;color:#54625B;max-width:44ch\">Every bill a household sent for a human read has been answered. New requests land here within a minute of arriving.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAudit }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;color:#178A5A\">Accountability<\u002Fdiv>\n          <h2 style=\"font:800 clamp(21px,2.8vw,27px)/1.2 'Satoshi',system-ui;letter-spacing:-.015em;color:#0A2018;margin:7px 0 4px\">Audit<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;color:#54625B\">Every staff mutation, with who did it and what changed. Written by the same log that records sign-ins.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n          <sc-for list=\"{{ auditFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.onClick }}\" style=\"border:1.5px solid #e7ebe6;background:#ffffff;border-radius:999px;padding:8px 15px;font:650 13px/1 'Satoshi',system-ui;color:#54625B;{{ f.selCss }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <section style=\"background:#ffffff;border:1px solid #e7ebe6;border-radius:20px;padding:clamp(17px,2.5vw,25px);box-shadow:0 1px 2px rgba(26,37,32,.04),0 8px 24px rgba(26,37,32,.05);animation:rise .5s both;display:flex;flex-direction:column;gap:22px\">\n          <sc-for list=\"{{ auditDays }}\" as=\"day\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:start\">\n              <div style=\"position:sticky;top:78px\">\n                <div style=\"font:700 12.5px/1.2 'Space Mono',ui-monospace,monospace;color:#0A2018\">{{ day.date }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5F6B64;margin-top:3px\">{{ day.count }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <sc-for list=\"{{ day.events }}\" as=\"e\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:12px;align-items:flex-start;padding-bottom:11px;border-bottom:1px solid #e7ebe6\">\n                    <span style=\"font:400 11.5px/1.5 'Space Mono',ui-monospace,monospace;color:#5F6B64;flex:0 0 44px\">{{ e.time }}<\u002Fspan>\n                    <div style=\"min-width:0;flex:1 1 auto\">\n                      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                        <span style=\"font:700 12.5px/1 'Space Mono',ui-monospace,monospace;border-radius:999px;padding:5px 9px;{{ e.pillCss }}\">{{ e.action }}<\u002Fspan>\n                        <span style=\"font-size:13px;color:#2B3A33\">{{ e.target }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ e.diff }}\">\n                        <div style=\"font:400 12px/1.5 'Space Mono',ui-monospace,monospace;color:#54625B;margin-top:6px;background:#F6F4EE;border-radius:9px;padding:7px 10px;word-break:break-word\">{{ e.diff }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <span style=\"font:400 11.5px/1.5 'Space Mono',ui-monospace,monospace;color:#5F6B64;flex:0 0 auto\">{{ e.actor }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ stepUp }}\">\n    <div sc-camel-on-click=\"{{ closeStepUp }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(10,32,24,.45);display:grid;place-items:center;padding:24px;animation:fadein .18s both\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"background:#ffffff;border-radius:20px;max-width:660px;width:100%;padding:28px;position:relative;animation:sheetin .24s both;box-shadow:0 24px 60px rgba(10,32,24,.28)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeStepUp }}\" aria-label=\"Close\" style=\"position:absolute;top:20px;right:20px;width:32px;height:32px;border:0;border-radius:999px;background:#F1EEE5;display:grid;place-items:center;color:#2B3A33\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <div style=\"font:700 11.5px/1 'Inter',system-ui;letter-spacing:.09em;text-transform:uppercase;{{ stepUp.eyebrowCss }}\">{{ stepUp.eyebrow }}<\u002Fdiv>\n        <h3 style=\"font:800 21px/1.25 'Satoshi',system-ui;letter-spacing:-.01em;color:#0A2018;margin:10px 0 8px;max-width:34ch\">{{ stepUp.title }}<\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:13.5px;color:#54625B;max-width:62ch;text-wrap:pretty\">{{ stepUp.body }}<\u002Fp>\n        <sc-if value=\"{{ stepUp.needsReason }}\">\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:#54625B;margin-bottom:16px\">Reason (sent to the company, required)\n            <textarea rows=\"3\" value=\"{{ reason }}\" sc-camel-on-change=\"{{ onReason }}\" placeholder=\"No letter of authorisation on file; the business number didn't match CRA records.\" style=\"border:1px solid #e7ebe6;background:#F6F4EE;border-radius:12px;padding:11px 13px;font:400 13px/1.5 'Inter',system-ui;resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fsc-if>\n        <div style=\"display:flex;align-items:center;gap:12px;background:#F6F4EE;border-radius:12px;padding:12px 14px;margin-bottom:18px\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#178A5A\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:0 0 auto\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.4\"><\u002Frect><path d=\"M8.4 10.5V7.8a3.6 3.6 0 0 1 7.2 0v2.7\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:12.5px;color:#54625B\">Step-up check passed: your session is <span style=\"font-family:'Space Mono',ui-monospace,monospace\">2h 14m<\u002Fspan> old, inside the 12-hour window destructive actions require.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ confirmStepUp }}\" style=\"border:0;color:#ffffff;border-radius:12px;padding:11px 20px;font:650 14px/1 'Satoshi',system-ui;{{ stepUp.btnCss }}\">{{ stepUp.confirmLabel }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ closeStepUp }}\" style=\"border:1.5px solid #e7ebe6;background:transparent;border-radius:12px;padding:11px 20px;font:650 14px/1 'Satoshi',system-ui;color:#2B3A33\" style-hover=\"background:#EDE8DB\">Keep things as they are<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\">\n    <div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:#2B3A33;color:#ffffff;border-radius:12px;padding:12px 18px;font:500 13.5px/1 'Inter',system-ui;box-shadow:0 12px 30px rgba(10,32,24,.28);animation:rise .3s both;display:flex;align-items:center;gap:10px\">\n      <span style=\"width:7px;height:7px;border-radius:999px;background:#7FE3B0\"><\u002Fspan>{{ toast }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;adminName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nadia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;killSwitchOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;sidebarCollapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;initialTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;config&quot;,&quot;campaigns&quot;,&quot;providers&quot;,&quot;leads&quot;,&quot;deep&quot;,&quot;audit&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;}}\">\nconst MONO = \"'Space Mono',ui-monospace,monospace\";\nconst STAGES = ['planned', 'waitlist', 'forming', 'auction', 'closed', 'archived'];\n\nconst PILL = {\n  good: 'background:#E4F4EC;color:#178A5A',\n  warm: 'background:#F7E7DD;color:#8C4622',\n  neutral: 'background:#F6F4EE;color:#54625B',\n  dark: 'background:#0E2A20;color:#ffffff'\n};\nconst DOT = { good: 'background:#1E9E63', warm: 'background:#C2643B', neutral: 'background:#8A968F', dark: 'background:#7FE3B0' };\n\nclass Component extends DCLogic {\n  state = {\n    tab: this.props.initialTab || 'overview',\n    collapsed: !!this.props.sidebarCollapsed,\n    search: '',\n    bidding: this.props.killSwitchOn !== false,\n    toast: null,\n    stepUp: null,\n    reason: '',\n    saved: false,\n    expanded: 'northline',\n    providerFilter: 'pending',\n    leadTable: 'WaitlistSignups',\n    leadShown: 8,\n    auditFilter: 'all',\n    mergeFrom: 'coteau-dup',\n    mergeTo: 'coteau',\n    config: [\n      { key: 'bidding_enabled', type: 'boolean', value: true, published: true, updated: '2026-07-29 14:02', description: 'The global kill switch. When off, no bid can be placed on any campaign.' },\n      { key: 'membership_price', type: 'number', value: '149', published: true, updated: '2026-06-11 09:47', description: 'Annual membership, rendered on the marketing site and at checkout.' },\n      { key: 'default_switch_threshold', type: 'number', value: '60', published: true, updated: '2026-05-30 16:20', description: 'Households a forming campaign needs before it can go to auction.' },\n      { key: 'banner_notice', type: 'string', value: 'Bidding for Windsor Core closes 12 August.', published: true, updated: '2026-07-28 08:15', description: 'Site-wide notice strip. Leave empty to hide the strip entirely.' },\n      { key: 'waitlist_open', type: 'boolean', value: true, published: true, updated: '2026-04-02 11:09', description: 'Whether new households can join a
