# Frontend consistency gate.
#
# The single biggest structural risk in this repo is that the desktop and
# mobile builds of the same page are separate files. They had already drifted
# in ways nobody noticed — the mobile estimator CTA pointed at the wrong page,
# mobile had no login link weeks after logins shipped, and every em dash in
# mobile copy had become a comma. Nothing failed, because nothing was checking.
#
# This workflow makes that class of drift a build error.

name: Check frontend

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "js/**"
      - "scripts/**"
      - "MobileVersion/**"
      - "Whollar Pricing Model.xlsx"
      - "PlanSavvy-Pricing.xlsx"
  pull_request:
    paths:
      - "**.html"
      - "js/**"
      - "scripts/**"
      - "MobileVersion/**"
      - "Whollar Pricing Model.xlsx"
      - "PlanSavvy-Pricing.xlsx"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails when any page's footer no longer matches the one definition in
      # scripts/build-footer.mjs — i.e. someone hand-edited a footer instead of
      # the generator, which is how /partners ended up shipping href="#" links.
      # Runs before the mobile check: the two generated mobile pages inherit
      # their footer from their desktop source.
      - name: Footers are in sync across every page
        run: node scripts/build-footer.mjs --check

      # Fails when a MobileVersion page no longer matches what its desktop
      # source + CSS overlay would generate — i.e. someone edited one side only.
      - name: Mobile pages are in sync with their desktop sources
        run: node scripts/build-mobile-pages.mjs --check

      # Fails when INTERNET_PLANS in js/checkup-savings.js no longer matches
      # what "PlanSavvy-Pricing.xlsx" > 'Internet Plans' would produce — i.e.
      # the sheet was updated but the embedded benchmark data wasn't.
      - name: Checkup plan pool matches the PlanSavvy spreadsheet
        run: node scripts/build-plan-pool.mjs --check

      # The shared module every form and the scoring engine now depend on.
      - name: Shared core parses
        run: node --check js/whollar-core.js

      # Fails when js/whollar-benchmarks.js no longer matches what the
      # spreadsheet would produce — i.e. the pricing model was updated but the
      # generated table wasn't, so the site is scoring against stale prices.
      - name: Benchmarks match the pricing spreadsheet
        run: node scripts/build-benchmarks.mjs --check

      # Fails when js/whollar-signal-lookup.js (the checkup's five-band card
      # reference, FSA-level) no longer matches what the pricing spreadsheet +
      # FSA-to-city map would produce.
      - name: Signal lookup matches the pricing spreadsheet
        run: node scripts/build-signal-lookup.mjs --check

      # Pure-function unit tests for the band-selection thresholds and
      # guardrails (js/whollar-core.js's W.selectBand). No DOM, no build step.
      - name: Signal band engine unit tests
        run: node --test scripts/test-select-band.mjs

      # Pure-function unit tests for the contract schedule engine
      # (W.buildSchedule / W.contractQuote): promo cliffs, elapsed vs
      # remaining cycles, stacked promo rows, and the clamps that keep a
      # below-market household from rendering a negative saving.
      - name: Contract schedule engine unit tests
        run: node --test scripts/test-contract-quote.mjs

      - name: Device router parses
        run: node --check js/device-router.js

      # Catches an unclosed brace or a stray character inside any inline
      # <script>, including the ones inside the self-unpacking bundle pages,
      # where a syntax error blanks the whole page.
      - name: Inline page scripts parse
        run: node scripts/check-inline-scripts.mjs
