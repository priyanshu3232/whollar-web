# Frontend consistency gate.
#
# The single biggest structural risk in this repo is that the desktop and
# mobile builds of the same page are separate files. They had already drifted
# in ways nobody noticed — the mobile estimator CTA pointed at the wrong page,
# mobile had no login link weeks after logins shipped, and every em dash in
# mobile copy had become a comma. Nothing failed, because nothing was checking.
#
# This workflow makes that class of drift a build error.

name: Check frontend

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "js/**"
      - "partner/**"
      - "scripts/**"
      - "MobileVersion/**"
      - "Whollar Pricing Model.xlsx"
  pull_request:
    paths:
      - "**.html"
      - "js/**"
      - "partner/**"
      - "scripts/**"
      - "MobileVersion/**"
      - "Whollar Pricing Model.xlsx"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails when any page's footer no longer matches the one definition in
      # scripts/build-footer.mjs — i.e. someone hand-edited a footer instead of
      # the generator, which is how /partners ended up shipping href="#" links.
      # Runs before the mobile check: the two generated mobile pages inherit
      # their footer from their desktop source.
      - name: Footers are in sync across every page
        run: node scripts/build-footer.mjs --check

      # Fails when a MobileVersion page no longer matches what its desktop
      # source + CSS overlay would generate — i.e. someone edited one side only.
      - name: Mobile pages are in sync with their desktop sources
        run: node scripts/build-mobile-pages.mjs --check

      # The shared module every form and the scoring engine now depend on.
      - name: Shared core parses
        run: node --check js/whollar-core.js

      # Fails when js/whollar-benchmarks.js no longer matches what the
      # spreadsheet would produce — i.e. the pricing model was updated but the
      # generated table wasn't, so the site is scoring against stale prices.
      - name: Benchmarks match the pricing spreadsheet
        run: node scripts/build-benchmarks.mjs --check

      # Fails when js/whollar-signal-lookup.js (the checkup's five-band card
      # reference, FSA-level) no longer matches what the pricing spreadsheet +
      # FSA-to-city map would produce.
      - name: Signal lookup matches the pricing spreadsheet
        run: node scripts/build-signal-lookup.mjs --check

      # Pure-function unit tests for the band-selection thresholds and
      # guardrails (js/whollar-core.js's W.selectBand). No DOM, no build step.
      - name: Signal band engine unit tests
        run: node --test scripts/test-select-band.mjs

      # Pure-function unit tests for the contract schedule engine
      # (W.buildSchedule / W.contractQuote): promo cliffs, elapsed vs
      # remaining cycles, stacked promo rows, and the clamps that keep a
      # below-market household from rendering a negative saving.
      - name: Contract schedule engine unit tests
        run: node --test scripts/test-contract-quote.mjs

      # The cohort auction stage, derived on read from the campaign calendar.
      # Pure (campaign, now) -> stage, so it needs no database and no clock,
      # which is exactly why stage is derived rather than written by a
      # scheduler. Guards the boundaries that decide whether a bid window is
      # shown as open.
      - name: Campaign stage unit tests
        run: node --test scripts/test-campaign-stage.mjs

      # The route guards. These decide whether an unapproved organisation can
      # place a bid, and they were copy-pasted across four route files before
      # being extracted into lib/guards.js. This is what stops the fifth copy.
      - name: Route guard unit tests
        run: node --test scripts/test-guards.mjs

      # Which organisation an email address resolves to, which is transitively
      # the answer to "who can see my sealed bid". Partner signup accepts
      # personal addresses now, and the whole safety of that rests on a free
      # provider keying on the full address rather than the bare domain.
      - name: Organisation key unit tests
        run: node --test scripts/test-org-key.mjs

      - name: Device router parses
        run: node --check js/device-router.js

      # The partner console is the one place in this repo with a build step.
      # This single check covers three failures at once, which is why it is
      # first: the module graph still resolves (an unimported or missing module
      # is an error, not a shrug), the committed bundle matches its source, and
      # the ?v= stamp in partner/index.html matches the bundle. /partner is
      # cached 24h, so a changed console with an unchanged stamp means partners
      # run new markup against old JavaScript for a day.
      - name: Partner console bundle is current
        run: node scripts/build-console.mjs --check

      # And that the thing a browser actually loads parses as a CLASSIC script.
      # This is what keeps the no-ESM rule true: partner/*.js is source and may
      # contain imports, the bundle may not, and node --check is what says so.
      - name: Partner console bundle parses
        run: node --check partner/console.build.js

      # The fixtures are a classic script loaded on demand, outside the bundle,
      # so nothing above covers them. They are .vercelignore'd, which means a
      # syntax error here would never fail a deploy and would only show up on
      # someone's laptop mid-QA.
      - name: Partner console fixtures parse
        run: node --check partner/demo/fixtures.js

      # Em dashes and the banned terminology, scoped to the console files where
      # the count is currently zero. Scoped rather than repo-wide on purpose:
      # older pages carry hundreds of em dashes, and a gate that is red on day
      # one gets switched off on day one.
      - name: Console copy rules
        run: node scripts/check-console-copy.mjs

      # Catches an unclosed brace or a stray character inside any inline
      # <script>, including the ones inside the self-unpacking bundle pages,
      # where a syntax error blanks the whole page.
      - name: Inline page scripts parse
        run: node scripts/check-inline-scripts.mjs
