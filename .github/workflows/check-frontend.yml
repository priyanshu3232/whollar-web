# Frontend consistency gate.
#
# The single biggest structural risk in this repo is that the desktop and
# mobile builds of the same page are separate files. They had already drifted
# in ways nobody noticed: the mobile estimator CTA pointed at the wrong page,
# mobile had no login link weeks after logins shipped, and every em dash in
# mobile copy had become a comma. Nothing failed, because nothing was checking.
#
# This workflow makes that class of drift a build error.

name: Check frontend

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "js/**"
      - "partner/**"
      - "scripts/**"
      - "MobileVersion/**"
      - "Whollar Pricing Model.xlsx"
      # The gate itself. Without this a change to a check does not run the
      # check, so a broken step ships green and is only found later by
      # something unrelated, which is exactly how the estimator DOM step went
      # unnoticed from the day it was added.
      - ".github/workflows/check-frontend.yml"
  pull_request:
    paths:
      - "**.html"
      - "js/**"
      - "partner/**"
      - "scripts/**"
      - "MobileVersion/**"
      - "Whollar Pricing Model.xlsx"
      # The gate itself. Without this a change to a check does not run the
      # check, so a broken step ships green and is only found later by
      # something unrelated, which is exactly how the estimator DOM step went
      # unnoticed from the day it was added.
      - ".github/workflows/check-frontend.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails when any page's footer no longer matches the one definition in
      # scripts/build-footer.mjs, i.e. someone hand-edited a footer instead of
      # the generator, which is how /partners ended up shipping href="#" links.
      # Runs before the mobile check: the two generated mobile pages inherit
      # their footer from their desktop source.
      - name: Footers are in sync across every page
        run: node scripts/build-footer.mjs --check

      # Fails when a MobileVersion page no longer matches what its desktop
      # source + CSS overlay would generate, i.e. someone edited one side only.
      - name: Mobile pages are in sync with their desktop sources
        run: node scripts/build-mobile-pages.mjs --check

      # The shared module every form and the scoring engine now depend on.
      - name: Shared core parses
        run: node --check js/whollar-core.js

      # The site-wide dropdown. It rewrites every <select> on the pages that
      # load it, so a parse error takes out four forms at once rather than one.
      - name: Shared select parses
        run: node --check js/whollar-select.js

      # Fails when js/whollar-benchmarks.js no longer matches what the
      # spreadsheet would produce, i.e. the pricing model was updated but the
      # generated table wasn't, so the site is scoring against stale prices.
      - name: Benchmarks match the pricing spreadsheet
        run: node scripts/build-benchmarks.mjs --check

      # Fails when js/whollar-signal-lookup.js (the checkup's five-band card
      # reference, FSA-level) no longer matches what the pricing spreadsheet +
      # FSA-to-city map would produce.
      - name: Signal lookup matches the pricing spreadsheet
        run: node scripts/build-signal-lookup.mjs --check

      # Fails when js/whollar-estimate-bench.js (the homepage estimator's
      # reference: cheapest advertised plan at 100 Mbps or better, per city)
      # no longer matches the spreadsheet + FSA-to-city map. Also fails when
      # an ALIAS target stops existing, which would otherwise silently send
      # a metro's FSAs to the province fallback.
      - name: Estimate bench matches the pricing spreadsheet
        run: node scripts/build-estimate-bench.mjs --check

      # Pure-function unit tests for the homepage quick estimate
      # (W.quickEstimate / W.estimateBenchFor): resolution basis, the
      # at-or-below path, and the bill guardrails.
      - name: Quick estimate unit tests
        run: node --test scripts/test-quick-estimate.mjs

      # The estimator widget driven in headless Chrome on BOTH surfaces that
      # carry it. MobileVersion/consumer-mobile.html is hand-maintained, not
      # generated, so this is what stops it drifting back to the retired
      # province-only estimator. Also asserts the POST body carries the FSA
      # and never the full postal code.
      # playwright-core has to be installed for this one, exactly as the
      # checkup DOM step below does it. --ignore-scripts so no browser is
      # downloaded: the test finds the runner's own Chrome by path, and
      # check-frontend stays install-free everywhere it can. Without this line
      # the step failed on ERR_MODULE_NOT_FOUND from the day it was added and
      # was invisible behind two earlier failures in the same job.
      - name: Homepage estimator DOM tests
        run: |
          npm ci --ignore-scripts
          node --test scripts/test-estimator-dom.mjs

      # Pure-function unit tests for the band-selection thresholds and
      # guardrails (js/whollar-core.js's W.selectBand). No DOM, no build step.
      - name: Signal band engine unit tests
        run: node --test scripts/test-select-band.mjs

      # Pure-function unit tests for the contract schedule engine
      # (W.buildSchedule / W.contractQuote): promo cliffs, elapsed vs
      # remaining cycles, stacked promo rows, and the clamps that keep a
      # below-market household from rendering a negative saving.
      - name: Contract schedule engine unit tests
        run: node --test scripts/test-contract-quote.mjs

      # The cohort auction stage, derived on read from the campaign calendar.
      # Pure (campaign, now) -> stage, so it needs no database and no clock,
      # which is exactly why stage is derived rather than written by a
      # scheduler. Guards the boundaries that decide whether a bid window is
      # shown as open.
      - name: Campaign stage unit tests
        run: node --test scripts/test-campaign-stage.mjs

      # scripts/cohort.mjs generates the ZCQL that opens and moves a cohort,
      # and predicts both dashboards from the row. Both claims rest on it
      # importing lib/catalog.js rather than restating its rules, so this
      # asserts the generated statement against KINDS, TRANSITIONS, COLUMNS and
      # DATE_COLUMNS. A tool that quietly disagrees with the server is worse
      # than no tool: it is a statement an operator pasted because it looked
      # checked.
      - name: Cohort ZCQL tool unit tests
        run: node --test scripts/test-cohort.mjs

      # Campaign state and seat counts through the REAL route handlers over
      # an in-memory Data Store. Section 9 is the sync contract: N members
      # join, and the member dashboard, the partner desk, the seat ledger
      # and the admin drift check all answer N from lib/cohorts.js. Section
      # 10 is the ghost guard: the shipped code catalog never reaches a
      # member or a partner.
      - name: Multi-campaign and cohort sync tests
        run: node scripts/test-multicampaign.mjs

      # Cohort stage notices. A stage is derived and moved by writing a date,
      # so nothing in the stack observes a transition: lib/notices.js compares
      # on read against a ledger of what has been announced. N-3 is the one
      # that matters, because the read path fires this on EVERY dashboard load
      # and a second sweep at the same stage must send nothing at all. N-4
      # holds the recipient list to catalog.standingOf rather than the stored
      # status, which is the difference between mailing a household that
      # joined while its region was still gathering and never mailing it.
      - name: Cohort stage notice tests
        run: node scripts/test-notices.mjs

      # The route guards. These decide whether an unapproved organisation can
      # place a bid, and they were copy-pasted across four route files before
      # being extracted into lib/guards.js. This is what stops the fifth copy.
      - name: Route guard unit tests
        run: node --test scripts/test-guards.mjs

      # Which organisation an email address resolves to, which is transitively
      # the answer to "who can see my sealed bid". Partner signup accepts
      # personal addresses now, and the whole safety of that rests on a free
      # provider keying on the full address rather than the bare domain.
      - name: Organisation key unit tests
        run: node --test scripts/test-org-key.mjs

      # Referral codes are one string with two implementations: the server
      # normalises what gets stored, the browser normalises what a share link
      # banks. The count is an exact match between them, so a character of
      # disagreement makes every referral count as zero and nothing anywhere
      # errors. That is precisely how the previous version shipped broken.
      - name: Referral code unit tests
        run: node --test scripts/test-referral.mjs

      # The opaque referral token: the mod-31 checksum (exhaustive substitution
      # and transposition sweeps, zero misses permitted), the issuance retry,
      # and the routing rule that lets tokens and legacy WHL-<hex> codes share
      # one normalize(). The count is an exact match on what normalize stored,
      # so an input routed to the wrong form is a referral that never counts.
      - name: Referral token unit tests
        run: node --test scripts/test-referral-token.mjs

      # The v17 checkup savings engine (js/checkup-savings.js): the 12-month
      # window, benchmark selection with the Ontario offer pool and the
      # out-of-province fallback, the four single-promo bases, multi-promo
      # walking, netted overpaid-to-date, tone thresholds, cliff pill.
      - name: Checkup savings engine acceptance tests
        run: node --test scripts/test-checkup-savings.mjs

      # The checkup page itself, driven in headless Chrome (playwright-core +
      # the runner's system Chrome; no browser download). Field order, the
      # multi-promo and I-don't-know states, the three-screen rail swap, the
      # verdict card, validation messages, and the rail clipping regression
      # guard (aside.scrollHeight - aside.clientHeight <= 1).
      - name: Checkup page DOM acceptance tests
        run: |
          npm ci --ignore-scripts
          node --test scripts/test-checkup-dom.mjs

      # The site-wide dropdown, driven on a real page in the same browser. It
      # hides every <select> behind a button, and page code all over this site
      # still reads select.value and listens for 'change' on it, so what this
      # guards is not the look: it is that the native control is still the
      # answer. A regression here reads as a form submitting the wrong option.
      - name: Site dropdown DOM acceptance tests
        run: |
          npm ci --ignore-scripts
          node --test scripts/test-select-dom.mjs

      - name: Device router parses
        run: node --check js/device-router.js

      # The partner console is the one place in this repo with a build step.
      # This single check covers three failures at once, which is why it is
      # first: the module graph still resolves (an unimported or missing module
      # is an error, not a shrug), the committed bundle matches its source, and
      # the ?v= stamp in partner/index.html matches the bundle. /partner is
      # cached 24h, so a changed console with an unchanged stamp means partners
      # run new markup against old JavaScript for a day.
      - name: Partner console bundle is current
        run: node scripts/build-console.mjs --check

      # And that the thing a browser actually loads parses as a CLASSIC script.
      # This is what keeps the no-ESM rule true: partner/*.js is source and may
      # contain imports, the bundle may not, and node --check is what says so.
      - name: Partner console bundle parses
        run: node --check partner/console.build.js

      # The fixtures are a classic script loaded on demand, outside the bundle,
      # so nothing above covers them. They are .vercelignore'd, which means a
      # syntax error here would never fail a deploy and would only show up on
      # someone's laptop mid-QA.
      - name: Partner console fixtures parse
        run: node --check partner/demo/fixtures.js

      # The server's copy of that vocabulary. The picker constrains coverage in
      # the browser; the write path is what constrains a CAMPAIGN, and it lives
      # in a CommonJS Catalyst function that cannot import the ES module the
      # picker is built from. Generated, therefore checkable, therefore checked.
      - name: The backend copy of the coverage vocabulary is current
        run: node scripts/build-places.mjs --check

      # The declarable vocabulary. Coverage is a controlled list now, and this
      # is the half of that the browser cannot enforce: a fixture, a seed or a
      # campaign naming a region the vocabulary does not have renders perfectly
      # and matches nothing, which is the free-text bug arriving by post.
      - name: The coverage vocabulary and everything that names a region
        run: node --test scripts/test-places.mjs

      # Em dashes and the banned terminology, scoped to the console files where
      # the count is currently zero. Scoped rather than repo-wide on purpose:
      # older pages carry hundreds of em dashes, and a gate that is red on day
      # one gets switched off on day one.
      - name: Console copy rules
        run: node scripts/check-console-copy.mjs

      # Catches an unclosed brace or a stray character inside any inline
      # <script>, including the ones inside the self-unpacking bundle pages,
      # where a syntax error blanks the whole page.
      - name: Inline page scripts parse
        run: node scripts/check-inline-scripts.mjs
