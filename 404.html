<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Whollar</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* No webfont here on purpose. A 404 is the one page that must render instantly
     on a bad connection, and the runbook's own item 42 is about getting third
     party font requests off the critical path: shipping this page with a Google
     Fonts link would add the very dependency the rest of the work removes. */
  :root{--paper:#FAFAF5;--ink:#0E2A20;--body:#27332C;--muted:#6E7B72;--accent:#12805A;--wash:#EBF3ED}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--body);
    font-family:'Bricolage Grotesque',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:26px}
  .box{max-width:520px;text-align:center}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:var(--accent);letter-spacing:.2em;font-size:13px}
  h1{font-weight:800;color:var(--ink);font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;margin:14px 0 0;line-height:1.08}
  p{font-size:17px;color:var(--muted);margin:16px 0 24px;line-height:1.55}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700;text-decoration:none;padding:12px 18px;border-radius:10px;border:1px solid var(--accent)}
  a.solid{background:var(--accent);color:#fff}
  a.solid:hover{background:var(--ink);border-color:var(--ink)}
  a.ghost{color:var(--accent)}
  a.ghost:hover{background:var(--wash)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404 · PAGE NOT FOUND</div>
    <h1>That page took a different plan.</h1>
    <p>The link may be old or mistyped. The resource library and the home page are both one tap away.</p>
    <div class="row">
      <a class="solid" href="/">Go to whollar.ca</a>
      <a class="ghost" href="/blog/">Read the resources</a>
    </div>
  </div>
</body>
</html>
